name: cargopulse

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cargopulse}:${POSTGRES_PASSWORD:-cargopulse}@db:5432/${POSTGRES_DB:-cargopulse}
  TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cargopulse}:${POSTGRES_PASSWORD:-cargopulse}@db:5432/cargopulse_test
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  OVERDUE_SCAN_INTERVAL_SECONDS: ${OVERDUE_SCAN_INTERVAL_SECONDS:-300}
  OVERDUE_GRACE_MINUTES: ${OVERDUE_GRACE_MINUTES:-0}
  OVERDUE_LOCK_TIMEOUT_SECONDS: ${OVERDUE_LOCK_TIMEOUT_SECONDS:-120}
  ENVIRONMENT: ${ENVIRONMENT:-development}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cargopulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargopulse}
      POSTGRES_DB: ${POSTGRES_DB:-cargopulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      <<: *backend-env
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      UVICORN_EXTRA_ARGS: ${UVICORN_EXTRA_ARGS:---reload}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command:
      ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
